extra_instructions = """
Read AGENTS.md at the repo root and review against it and the definition-of-done checklist in
docs/coding-and-testing-guidelines.md §2.7.
Reject the change (request changes) if any of these holds:
- a user-visible change has no line under `## [Unreleased]` in CHANGELOG.md, or puts it under a version heading;
- the change needs an ADR (hard to reverse, moves a trust boundary, changes build/release/distribution, rejects a
  non-obvious alternative) and has none;
- a new or changed tool call does not resolve through `gated_call` (or an explicit always-auto-approve connector),
  or leaves no audit trail;
- it touches `.github/workflows/`, `.agents/`, release material or `credentials/`, or does more than one half of a
  connector (connect, then tools).
Also flag content in logs or preview dicts, a missing `<Name>ClientError`, new module state without a reset in
tests/conftest.py, and comments that restate what the code does.
"""
