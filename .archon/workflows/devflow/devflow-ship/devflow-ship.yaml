name: devflow-ship
description: |
  The devflow toolkit (andras-tkcs/claude-toolkit) as one Archon run, from an ask to a
  merged pull request: make-plan, implement, review, fix the blocking findings, fix the
  non-blocking ones, run the definition of done, open the PR, then watch it until it merges,
  resolving conflicts, red CI and review threads on the way. Every project fact comes from
  .claude/toolkit.yaml, the same profile /make-plan, /implement and /dod read.

  Pauses for a person only where /make-plan would ask: a decision only the user can make,
  or manual_before steps to confirm. Merging stays with a person; the run never merges.

  Use when: an issue or a described change should go all the way to a merged PR the way
  /make-plan + /implement would take it, "ship this issue with devflow".
  NOT for: a repo-wide review (/review), cutting a release, or a dependency bump.
model: large
worktree:
  enabled: true
inputs:
  work:
    default: ""
    description: What to build (an issue number or URL, a /review document URL, or a description). Empty means the run's message is the work.
returns: finish
outcome_field: merged

nodes:
  # ---- Setup: profile, toolkit, environment ----------------------------------------------
  - id: preflight
    script: preflight
    runtime: bun
    output_format:
      type: object
      properties:
        devflow_root: { type: string }
        main_branch: { type: string }
        branch_regex: { type: string }
      required: [devflow_root, main_branch, branch_regex]

  - id: setup
    depends_on: [preflight]
    script: setup-env
    runtime: bun
    timeout: 1800000

  # ---- 1. make-plan ----------------------------------------------------------------------
  - id: plan
    depends_on: [setup]
    command: plan
    model: large
    output_format:
      type: object
      properties:
        scope: { type: string, enum: [small, large] }
        slug: { type: string }
        branch: { type: string }
        title: { type: string }
        needs_user: { type: boolean }
        ask: { type: string }
      required: [scope, slug, branch, title, needs_user, ask]

  - id: clarify
    depends_on: [plan]
    when: "$plan.output.needs_user == true"
    wait:
      attention: "$plan.output.ask"
      form: message
      labels:
        workflow: devflow-ship
        stage: plan

  - id: replan
    depends_on: [clarify]
    command: replan
    model: large
    context: { resume: plan }
    output_format:
      type: object
      properties:
        proceed: { type: boolean }
        reason: { type: string }
        scope: { type: string, enum: [small, large] }
        slug: { type: string }
        branch: { type: string }
        title: { type: string }
      required: [proceed, reason, scope, slug, branch, title]

  - id: prepare-branch
    depends_on: [plan, replan]
    trigger_rule: none_failed_min_one_success
    script: prepare-branch
    runtime: bun
    with:
      plan: "$plan.output"
      replan: { from: "$replan.output", if_skipped: "" }
      branch_regex: "$preflight.output.branch_regex"
      main_branch: "$preflight.output.main_branch"
    output_format:
      type: object
      properties:
        proceed: { type: boolean }
        reason: { type: string }
        scope: { type: string }
        slug: { type: string }
        branch: { type: string }
        title: { type: string }
      required: [proceed, reason, scope, slug, branch, title]

  - id: stop-at-plan
    depends_on: [prepare-branch]
    when: "$prepare-branch.output.proceed == false"
    cancel: "Stopped at planning: $prepare-branch.output.reason"

  # ---- 2. implement: one fresh Sonnet session per phase, fast checks after each --------------
  - id: build
    depends_on: [prepare-branch]
    when: "$prepare-branch.output.proceed == true"
    loop_group:
      nodes:
        - id: implement
          command: implement
          model: medium
          context: fresh
          output_format:
            type: object
            properties:
              status: { type: string, enum: [continue, complete, blocked] }
              phase: { type: string }
              summary: { type: string }
            required: [status, phase, summary]
        - id: check
          depends_on: [implement]
          script: verify
          runtime: bun
          timeout: 1800000
          with:
            mode: fast
          output_format:
            type: object
            properties:
              green: { type: boolean }
              failed: { type: array, items: { type: string } }
              unavailable: { type: array, items: { type: string } }
              report: { type: string }
            required: [green, failed, unavailable, report]
      until_bash: 's=$implement.output.status; g=$check.output.green; [ "$s" = blocked ] || { [ "$s" = complete ] && [ "$g" = true ]; }'
      max_iterations: 12

  - id: gate-build
    depends_on: [build]
    script: gate-build
    runtime: bun
    with:
      branch: "$prepare-branch.output.branch"
      main_branch: "$preflight.output.main_branch"
      slug: "$prepare-branch.output.slug"
      green: "$build.output.green"

  # ---- 3 + 4. review (Opus, fresh) and fix the blocking findings, until none are left ------
  # Each round fixes what the previous review found, then reviews again, so the loop's output
  # is always the latest review's verdict; review-gate reads it after the loop.
  - id: review-loop
    depends_on: [gate-build]
    loop_group:
      nodes:
        - id: fix-blocking
          when: "$LOOP_PREV.review.output.blocking > 0"
          command: fix-blocking
          model: medium
          context: fresh
        - id: review
          depends_on: [fix-blocking]
          trigger_rule: all_done
          command: review
          model: large
          context: fresh
          output_format:
            type: object
            properties:
              verdict: { type: string, enum: [approve, changes] }
              blocking: { type: integer }
              non_blocking: { type: integer }
              head: { type: string }
            required: [verdict, blocking, non_blocking, head]
      until_bash: 'b=$review.output.blocking; [ "$b" -eq 0 ]'
      max_iterations: 3

  - id: review-gate
    depends_on: [review-loop]
    when: "$review-loop.output.blocking > 0"
    bash: 'echo "devflow: the review still has blocking findings after its last round; a person decides next (see review.md in the run artifacts)" >&2; exit 1'

  # ---- 5. fix the non-blocking findings (or decline each with a reason) -------------------
  - id: fix-nonblocking
    depends_on: [review-loop, review-gate]
    trigger_rule: none_failed_min_one_success
    command: fix-nonblocking
    model: medium
    context: fresh

  # ---- Definition of done: verify.dod must be green before the PR opens ------------------
  - id: dod-loop
    depends_on: [fix-nonblocking]
    loop_group:
      nodes:
        - id: dod-fix
          when: "$LOOP_PREV.dod.output.green == false"
          command: dod-fix
          model: medium
          context: fresh
        - id: dod
          depends_on: [dod-fix]
          trigger_rule: all_done
          script: verify
          runtime: bun
          timeout: 3600000
          with:
            mode: dod
          output_format:
            type: object
            properties:
              green: { type: boolean }
              failed: { type: array, items: { type: string } }
              unavailable: { type: array, items: { type: string } }
              report: { type: string }
            required: [green, failed, unavailable, report]
      until_bash: 'g=$dod.output.green; [ "$g" = true ]'
      max_iterations: 3

  - id: dod-gate
    depends_on: [dod-loop]
    when: "$dod-loop.output.green == false"
    bash: 'echo "devflow: the definition of done is still red after its last fix; no PR was opened (see verify-dod.md in the run artifacts)" >&2; exit 1'

  # ---- Open the one PR ---------------------------------------------------------------------
  - id: open-pr
    depends_on: [dod-loop, dod-gate]
    trigger_rule: none_failed_min_one_success
    command: open-pr
    model: medium
    context: fresh
    output_format:
      type: object
      properties:
        number: { type: integer }
        url: { type: string }
      required: [number, url]

  # ---- 6. watch the PR until it merges: conflicts, red CI, review threads ------------------
  - id: watch
    depends_on: [open-pr]
    loop_group:
      nodes:
        - id: pr-state
          script: pr-state
          runtime: bun
          with:
            number: "$open-pr.output.number"
            main_branch: "$preflight.output.main_branch"
          output_format:
            type: object
            properties:
              finished: { type: boolean }
              state: { type: string }
              act: { type: boolean }
              reasons: { type: string }
            required: [finished, state, act, reasons]
        - id: steward
          depends_on: [pr-state]
          when: "$pr-state.output.act == true"
          command: steward
          model: medium
          context: fresh
        - id: pause
          depends_on: [pr-state, steward]
          trigger_rule: all_done
          when: "$pr-state.output.finished == false"
          wait:
            duration_ms: 600000
      until_bash: 'f=$pr-state.output.finished; [ "$f" = true ]'
      max_iterations: 600

  - id: finish
    depends_on: [watch]
    script: finish
    runtime: bun
    with:
      number: "$open-pr.output.number"
    output_format:
      type: object
      properties:
        merged: { type: boolean }
        state: { type: string }
        url: { type: string }
      required: [merged, state, url]
