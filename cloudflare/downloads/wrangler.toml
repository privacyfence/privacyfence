#:schema node_modules/wrangler/config-schema.json
# Cloudflare Worker backing https://downloads.privacyfence.eu -- see
# docs/downloads-and-release-kpi.md and its "Cloudflare resources" table for the
# provisioned account/zone/bucket/database identifiers this file references.
name = "privacyfence-downloads"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# `workers_dev = false` plus the custom domain below is the production-final routing, and it was
# committed from day one -- before the dashboard toggle was flipped off -- so that a later
# `wrangler deploy` from CI could never silently re-enable a `*.workers.dev` URL. It took effect
# on the first successful deploy, so that URL no longer exists; there is deliberately no path in
# this repo that turns it back on.
workers_dev = false

[[routes]]
pattern = "downloads.privacyfence.eu"
custom_domain = true

# Binding names must match the dashboard-provisioned resources exactly (see
# docs/downloads-and-release-kpi.md's "Cloudflare resources" table) -- the Worker never carries
# its own R2/S3 credentials; both bindings
# are the only path this Worker has to the underlying storage.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "privacyfence-releases"

[[d1_databases]]
binding = "DB"
database_name = "privacyfence-downloads"
database_id = "1cb5c99c-6d34-4031-a5f6-2f3a406e4979"
migrations_dir = "migrations"

[observability]
enabled = true
