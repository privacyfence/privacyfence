<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" role="img" aria-labelledby="pf-arch-title pf-arch-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="pf-arch-title">How a request travels through PrivacyFence</title>
  <desc id="pf-arch-desc">An AI client (Claude Desktop through the PrivacyFence extension, Claude Code over HTTP, or claude.ai through an organization deployment) sends each tool call over MCP to PrivacyFence. PrivacyFence applies policy, runs the local PII check, asks a person for approval where needed, and audits the decision. Only then does its connector call the service (Gmail, Google Drive, Calendar, Slack, Salesforce, Jira, Confluence, Telegram and more) with credentials that stay inside PrivacyFence.</desc>
  <!-- The source of the /how-it-works/ diagram and README.md's. Below 600 px the page shows
       architecture-narrow.svg, the same content top to bottom; change both together. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#43535f"/>
    </marker>
  </defs>

  <rect width="1120" height="540" fill="#f6f8fb"/>

  <!-- Column headings -->
  <g font-size="12" font-weight="700" fill="#0e5f57" letter-spacing="1.3">
    <text x="30" y="40">AI CLIENT</text>
    <text x="262" y="40">MCP</text>
    <text x="492" y="40">YOUR COMPUTER OR SERVER</text>
    <text x="852" y="40">CONNECTED SERVICES</text>
  </g>

  <!-- AI clients -->
  <g font-size="15" font-weight="700" fill="#14212b">
    <rect x="30" y="80" width="190" height="64" rx="12" fill="#ffffff" stroke="#dbe3e9" stroke-width="1.5"/>
    <text x="50" y="118">Claude Desktop</text>
    <rect x="30" y="220" width="190" height="64" rx="12" fill="#ffffff" stroke="#dbe3e9" stroke-width="1.5"/>
    <text x="50" y="258">Claude Code</text>
    <rect x="30" y="360" width="190" height="64" rx="12" fill="#ffffff" stroke="#dbe3e9" stroke-width="1.5"/>
    <text x="50" y="388">claude.ai</text>
    <text x="50" y="408" font-size="12" font-weight="500" fill="#60707d">organization deployment</text>
  </g>
  <text x="30" y="456" font-size="12.5" fill="#60707d">or another MCP-compatible client</text>

  <!-- Transport -->
  <rect x="262" y="80" width="190" height="64" rx="12" fill="#eef3f8" stroke="#dbe3e9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="280" y="106" font-size="13.5" font-weight="700" fill="#14212b">Extension (.mcpb)</text>
  <text x="280" y="126" font-size="12" fill="#43535f">stdio shim to /mcp, local files</text>
  <line x1="220" y1="112" x2="258" y2="112" stroke="#43535f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="452" y1="112" x2="484" y2="160" stroke="#43535f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="220" y1="252" x2="484" y2="252" stroke="#43535f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="262" y="240" font-size="12" fill="#43535f">HTTP /mcp + local token</text>

  <line x1="220" y1="392" x2="484" y2="360" stroke="#43535f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="262" y="414" font-size="12" fill="#43535f">HTTPS /mcp + OAuth sign-in</text>

  <!-- PrivacyFence -->
  <rect x="488" y="62" width="310" height="440" rx="20" fill="#e1f2ef" stroke="#167a70" stroke-width="2"/>
  <text x="510" y="96" font-size="18" font-weight="800" fill="#14212b">PrivacyFence</text>
  <text x="510" y="116" font-size="12" fill="#0e5f57">decides independently of the AI</text>

  <g font-size="14" font-weight="700" fill="#14212b">
    <rect x="510" y="134" width="266" height="58" rx="10" fill="#ffffff" stroke="#badbd6" stroke-width="1.5"/>
    <text x="526" y="158">1  Policy</text>
    <text x="526" y="178" font-size="12" font-weight="500" fill="#43535f">the tool's gate and your always-allow rules</text>

    <rect x="510" y="210" width="266" height="58" rx="10" fill="#ffffff" stroke="#badbd6" stroke-width="1.5"/>
    <text x="526" y="234">2  PII check</text>
    <text x="526" y="254" font-size="12" font-weight="500" fill="#43535f">runs locally, before anything is released</text>

    <rect x="510" y="286" width="266" height="58" rx="10" fill="#ffffff" stroke="#badbd6" stroke-width="1.5"/>
    <text x="526" y="310">3  Human approval</text>
    <text x="526" y="330" font-size="12" font-weight="500" fill="#43535f">you allow or deny, on the Approvals page</text>

    <rect x="510" y="362" width="266" height="58" rx="10" fill="#ffffff" stroke="#badbd6" stroke-width="1.5"/>
    <text x="526" y="386">4  Audit</text>
    <text x="526" y="406" font-size="12" font-weight="500" fill="#43535f">every decision, in a chained audit log</text>
  </g>
  <g stroke="#167a70" stroke-width="1.6">
    <line x1="643" y1="192" x2="643" y2="206" marker-end="url(#arrow)"/>
    <line x1="643" y1="268" x2="643" y2="282" marker-end="url(#arrow)"/>
    <line x1="643" y1="344" x2="643" y2="358" marker-end="url(#arrow)"/>
  </g>
  <rect x="510" y="436" width="266" height="46" rx="10" fill="#142b2b"/>
  <text x="526" y="464" font-size="13" font-weight="700" fill="#eaf4f3">Connector credentials stay here</text>

  <!-- To the services -->
  <line x1="798" y1="282" x2="846" y2="282" stroke="#43535f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="802" y="270" font-size="11" fill="#43535f">API call</text>

  <rect x="852" y="62" width="238" height="440" rx="20" fill="#ffffff" stroke="#dbe3e9" stroke-width="1.5"/>
  <g font-size="14" font-weight="650" fill="#14212b">
    <text x="874" y="104">Gmail</text>
    <text x="874" y="136">Google Drive, Docs, Sheets</text>
    <text x="874" y="168">Calendar, Contacts, Tasks</text>
    <text x="874" y="200">Apps Script</text>
    <text x="874" y="232">Slack</text>
    <text x="874" y="264">Telegram</text>
    <text x="874" y="296">Salesforce</text>
    <text x="874" y="328">Jira</text>
    <text x="874" y="360">Confluence</text>
  </g>
  <line x1="874" y1="390" x2="1068" y2="390" stroke="#dbe3e9" stroke-width="1.5"/>
  <text x="874" y="418" font-size="12" fill="#60707d">Straight from PrivacyFence to</text>
  <text x="874" y="436" font-size="12" fill="#60707d">the provider. No PrivacyFence-</text>
  <text x="874" y="454" font-size="12" fill="#60707d">operated server in between.</text>
</svg>
