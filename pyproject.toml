[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyfence"
dynamic = ["version"]
description = "Privacy proxy between Claude (MCP) and your personal data, with an embedded web approval/settings UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Andras Takacs", email = "info@privacyfence.eu" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "ai-governance",
    "privacy",
    "pii",
    "audit",
    "gdpr",
]
# PyPI's browse/filter facets, and the sidebar metadata a `pip install privacyfence`
# visitor sees first. `Programming Language :: Python :: 3.x` entries are the versions
# CI actually tests (.github/workflows/tests.yml: 3.11 and 3.12 in the matrix, 3.13 in
# the main `test` job), which is also what `requires-python` above claims -- keep the
# three in sync when a version is added or dropped.
#
# Development Status stays at Beta rather than Production/Stable while the README's
# "Status and scope" section still asks people to review the limitations and security
# model before using PrivacyFence with production or regulated data.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.100.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "slack-sdk>=3.27.0",
    "telethon>=1.36.0",
    "atlassian-python-api>=3.41.0",
    "simple-salesforce>=1.12.0",
    "requests>=2.31.0",
    "certifi>=2024.2.2",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    # text_extraction.py's DOCX/PPTX parsing: that content is an
    # attacker-controlled attachment fetched and parsed pre-approval, so its
    # embedded XML parts get defusedxml's stdlib-compatible ElementTree
    # rather than xml.etree.ElementTree, which has no protection against
    # billion-laughs/entity-expansion-style XML attacks on its own.
    "defusedxml>=0.7.1",
    # Embedded HTTP(S) server for the web approval surface (D10): this stack is brought in
    # starting at P1, ahead of the MCP-over-HTTP endpoint itself, so
    # web/server.py isn't written twice against two different stacks.
    # Platform-independent -- installed everywhere, unlike the AppKit
    # dependencies above.
    #
    # Floor raised from 0.37 to 1.3.1 (SEC-19): every starlette release below
    # 1.3.1 has at least one of five CVEs pip-audit's dependency-audit.yml
    # gate found live in this repo's original <1.0-capped range.
    # PYSEC-2026-161/CVE-2026-48710 and PYSEC-2026-248/CVE-2026-54282 are
    # directly relevant here, not just theoretical: an unvalidated Host
    # header / request path can move `request.url`'s authority boundary,
    # and `web/session_auth.py::check_origin` and
    # `web/org_session.py::check_origin` both compare an incoming `Origin`
    # header against `request.url.scheme`/`.netloc` as defense-in-depth on
    # top of the CSRF double-submit token -- a corrupted `request.url`
    # could have made that comparison meaningless (not a full bypass on
    # its own, since the double-submit token is the primary check, but
    # exactly the kind of secondary control this bug would quietly
    # defeat). PYSEC-2026-249/CVE-2026-54283 (unbounded urlencoded form
    # parsing) and PYSEC-2026-2281/2280 (a Windows UNC-path SSRF and an
    # HTTPEndpoint verb-dispatch bypass, both StaticFiles/class-based-view
    # issues this app's own route functions don't use) are fixed by the
    # same bump regardless.
    "starlette>=1.3.1,<2.0",
    "uvicorn>=0.30,<1.0",
    # Official MCP Python SDK, promoted from a test-only dependency to a
    # runtime one at P2 (D2):
    # web/routes_mcp.py hosts the real Streamable HTTP MCP endpoint on it,
    # not just tests/integration/test_mcp_daemon_contract.py's client
    # side anymore. Migrated off the 1.x surface at issue #250: this is now
    # a v2-only floor, not a widened range, because the 2.0 server API is
    # not additive over 1.x's -- the low-level `Server` registers handlers
    # as constructor arguments (`on_list_tools=`/`on_call_tool=`) instead of
    # `@server.list_tools()` decorators, a handler is `(ctx, params) ->
    # Result` rather than a bare return value read back off
    # `Server.request_context`, and the per-session `lifespan` this module
    # keyed its unattended-session/dedupe state by is entered once per
    # session *manager* now (see routes_mcp._session_key). None of that
    # runs on 1.x, so a range starting below 2 would resolve to an install
    # that imports and then fails on the first request.
    # The floor is the exact minor this was migrated and tested against
    # rather than a bare >=2.0: 2.x is still moving its own server-side
    # surface (`create_initialization_options`'s `extensions` argument, the
    # `Context`/middleware rework its own TODO(L54) flags), and this package
    # overrides that method. Model field names are snake_case with
    # camelCase aliases from 2.0 on (`is_error`/`structured_content`/
    # `input_schema`) -- constructing by alias still validates, reading one
    # back by alias does not.
    "mcp>=2.2,<3.0.0",
    # Verifying the org IdP's ID token (P7: PrivacyFence is its own minimal OAuth 2.1 authorization
    # server, authenticating the human against the org's
    # IdP by OIDC behind the scenes) means checking a JWT signature against
    # a JWKS endpoint -- the same "security-critical, spec-governed, don't
    # hand-roll it" reasoning D2 already gave for the MCP SDK itself
    # applies here. Already an undeclared transitive dependency of `mcp`
    # itself (and of simple-salesforce) as of this writing, so this adds no
    # new package to what's actually installed -- it just stops relying on
    # that being true by accident.
    "PyJWT>=2.8,<3.0",
    # WebAuthn step-up authentication for org-mode write approvals (P9, D7):
    # parsing CBOR attestation objects and verifying COSE signatures is exactly the same
    # "security-critical, spec-governed, don't hand-roll it" case D2
    # already made for the MCP SDK -- see webauthn_stepup.py's own module
    # docstring.
    "webauthn>=3.0,<4.0",
    # Cross-platform single-instance file locking for daemon_main.py's
    # _acquire_instance_lock()/_release_instance_lock():
    # picks the right OS primitive itself (fcntl.flock on POSIX,
    # msvcrt/LockFileEx on Windows), the same "don't hand-roll a
    # platform-locking primitive" reasoning already given above for
    # PyJWT/webauthn. Not a platform-conditional extra -- it's a small,
    # pure-Python-plus-stdlib-ctypes library that's a no-op cost on every
    # platform, so every install gets it rather than branching the
    # dependency list by sys_platform.
    "portalocker>=2.8",
    # #428 Phase 3 (ADR 0002 decision 4): the companion app's tray/menu-bar icon on macOS/
    # Windows -- a base dependency, not an optional extra, so a plain `pip install privacyfence`
    # can run the companion entry point (companion.py) out of the box on the platforms it
    # applies to. Platform-marked rather than unconditional: Linux has no tray at all (see
    # companion.py's own module docstring -- it gets an XDG launcher instead) and would gain
    # nothing from either package. Pillow backs the icon image pystray.Icon() requires; also
    # declared (for an unrelated, build-time-only reason) in the dev extra below.
    "pystray>=0.19; sys_platform == 'darwin' or sys_platform == 'win32'",
    "Pillow>=10.0; sys_platform == 'darwin' or sys_platform == 'win32'",
]

# The PyPI sidebar. Without these the project page carries no link back to anything --
# no homepage, no source, no issue tracker -- and that page is all a visitor arriving
# from `pip install privacyfence` gets to see (privacyfence/privacyfence#370).
# Download points at the website's download page rather than GitHub Releases because
# that is the canonical download surface and the one that counts the download KPI
# (docs/downloads-and-release-kpi.md).
[project.urls]
Homepage = "https://privacyfence.eu"
Download = "https://privacyfence.eu/download/"
Documentation = "https://github.com/privacyfence/privacyfence/blob/main/docs/README.md"
Source = "https://github.com/privacyfence/privacyfence"
Changelog = "https://github.com/privacyfence/privacyfence/blob/main/CHANGELOG.md"
Issues = "https://github.com/privacyfence/privacyfence/issues"
Security = "https://github.com/privacyfence/privacyfence/blob/main/SECURITY.md"

[project.scripts]
privacyfence-app = "privacyfence.daemon_main:main"
# #428 Phase 3 (ADR 0002): the companion app -- see companion.py's own module docstring.
privacyfence-companion = "privacyfence.companion:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
privacyfence = [
    "resources/*.png",
    "resources/settings.yaml.example",
    "resources/connector_icons/*.png",
    "resources/connector_icons/README.md",
    "resources/agent_icons/*.png",
    "resources/agent_icons/README.md",
]

[project.optional-dependencies]
# The macos-native extra (rumps + three pyobjc-framework-* packages, gated
# to sys_platform == 'darwin') that used to live here backed the native
# menu bar / AppKit approval and settings windows P10 (decision D6) deleted -- nothing in
# src/privacyfence/ had imported any of them since. Removed at Phase 3
# PR3.9: an unused extra is
# still a dependency-scanning and audit-surface cost, and D6's own "the
# ApprovalUI seam lets it come back if that proves wrong" reasoning for
# keeping it declared didn't materialize into any actual native-UI work
# in the time since. The exact package set is preserved in
# docs/adr/0001-remove-macos-native-extra.md for whoever picks that back
# up.
dev = [
    "pyinstaller>=6.0",
    # sdist/wheel build + local upload, for rehearsing a release by hand --
    # see the "Publishing to PyPI" section of CLAUDE.md. CI
    # (.github/workflows/publish-pypi.yml) installs `build` itself and
    # never needs twine: it uploads via pypa/gh-action-pypi-publish's OIDC
    # trusted-publishing flow, not a stored token, so nothing here signs
    # in as CI.
    "build>=1.2",
    "twine>=5.0",
    # Build-time-only PNG -> multi-resolution .ico conversion for the
    # Windows build: unlike
    # macOS's sips/iconutil (used by build_dmg.sh), there's no Windows-
    # native icon-conversion tool available cross-platform in CI, so
    # scripts/build_installer.ps1 does it with Pillow instead. Not a
    # runtime dependency -- mirrors how pyinstaller itself is dev-extra-
    # only above.
    "Pillow>=10.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    # The official MCP Python client used by
    # tests/integration/test_mcp_daemon_contract.py (a real loopback socket
    # speaking Streamable HTTP to a real web/server.py WebServer) and
    # tests/unit/web/test_routes_mcp.py (the same /mcp endpoint over an
    # in-process ASGI transport, no real socket) is `mcp` itself -- now a
    # runtime dependency (see pyproject.toml's [project.dependencies],
    # P2/D2), not listed again here.
    "freezegun>=1.5",
    # starlette.testclient.TestClient's transport -- test-only, exercising
    # web/ routes (tests/unit/web/) without a real socket.
    "httpx>=0.27",
    # The *other* httpx, and not a typo: mcp 2.x's own client transports are
    # written against httpx2 (`streamable_http_client(url, http_client=...)`
    # is annotated `httpx2.AsyncClient` and hands the response to httpx2's
    # own EventSource), so every test driving /mcp through the official
    # client -- over a real socket or an in-process ASGI transport -- builds
    # its client from this package while the rest of the suite keeps using
    # httpx for starlette's TestClient. Already installed as a transitive
    # dependency of `mcp`; declared here because these tests import it
    # directly rather than relying on that staying true.
    "httpx2>=2.5",
    # tests/integration/test_browser_smoke.py -- drives the real web approval
    # surface in a real headless browser, for the CSP/SameSite-cookie/SSE
    # behavior only a real browser actually enforces (see that module's own
    # docstring). Also needs a downloaded Chromium build (`playwright
    # install chromium`, see .github/workflows/tests.yml); the test module
    # skips itself if either is missing, so this alone doesn't force a
    # browser download on every `pip install -e ".[test]"`.
    "playwright>=1.48,<2.0",
    # TST-12: round-trip
    # property tests on html_to_text.py/markdown_to_html.py/email_markdown.py/
    # text_extraction.py (tests/unit/test_parser_properties.py) -- generated
    # random inputs catch parser edge cases (unbalanced tags, adversarial
    # Markdown syntax, arbitrary Unicode) example-based tests don't think to
    # write, which matters here specifically because these are the modules
    # standing between untrusted external content and the approval popup's
    # preview pane.
    "hypothesis>=6.100",
]
# Static analysis gate (TST-07). ruff and bandit are CI-blocking steps ([tool.ruff.lint] /
# [tool.bandit] below); mypy runs in CI twice -- non-blocking over the whole tree, and blocking
# over the modules promoted by the [[tool.mypy.overrides]] ratchet below -- see the comments on
# those tool sections for why.
lint = [
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
]

[tool.setuptools_scm]
# The version is derived entirely from git tags now -- see this repo's
# CLAUDE.md "Releasing" section. A release tag looks like `vX.Y.Z` (stable)
# or `vX.Y.Z<a|b|rc><N>` (pre-release, PEP 440 short form, e.g. `v4.0.0a13`);
# setuptools_scm reads it via `importlib.metadata.version("privacyfence")`
# at runtime (see src/privacyfence/__init__.py). Between tags it synthesizes
# a `<next-version>.devN+g<sha>` version (e.g. `4.0.1.dev3+gabc1234`) -- that
# shape is what update_checker.py's parse_version() is built to accept, not
# just exact release tags.
#
# fallback_version only matters before this repo's very first tag exists
# (or if git/tag history is unavailable, e.g. a tarball with no .git/) --
# it's never a real shipped version, so it's deliberately not "4.0.0..."
# alpha-series-looking, to avoid being mistaken for one.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung asyncio socket test (e.g. a fixture never closing a connection)
# would otherwise block the whole suite indefinitely instead of failing.
timeout = 30
# The seven-layer taxonomy docs/testing-policy.md describes. Registered here
# so `pytest -m <marker>` and `pytest -m "not live"` work and so an
# unregistered-marker typo fails loudly (pytest's default
# `--strict-markers`-independent warning) rather than silently matching
# nothing. See testing-policy.md for which modules carry which marker.
markers = [
    "unit: fast, fully offline",
    "integration: real internal stack, no external network",
    "system: full daemon/MCP/approval/audit scenario",
    "browser: real Chromium via Playwright",
    "packaged: runs against a built installer/artifact",
    "live: touches a real third-party provider (self-hosted runner only)",
    # OS-level path/process/locking/daemon-discovery behavior, homed under
    # tests/platform/ rather than scattered across existing files.
    # Deliberately a separate marker from `system`, which is the full
    # daemon/MCP/approval/audit scenario -- a different concept.
    "platform: OS-level path/process/locking/daemon behavior (tests/platform/)",
]

[tool.coverage.run]
# TST-03: branch coverage, not
# just line coverage, is what scripts/check_coverage_floor.py's floors are
# computed against -- a line that's always reached but whose "else" arm
# never runs (e.g. a fail-open branch nothing exercises) reads as fully
# covered under line-only coverage. `--cov-branch` on the CI/pre-release
# pytest invocations is redundant with this but kept explicit there so it's
# visible without opening this file.
branch = true
source = ["src/privacyfence"]

# --- Static analysis (TST-07) --- #

[tool.ruff]
target-version = "py311"
# Not tied to any rule in `select` below today (none of them care about
# width), but set for when line-length-sensitive rules get added.
line-length = 120

[tool.ruff.lint]
# Pinned explicitly rather than left at ruff's shifting default so a ruff
# upgrade can't silently turn on/off rules underneath CI. This is the
# "ruff blocking immediately" half of TST-07 -- E4/E7/E9 (syntax errors,
# obvious logic errors) and F (pyflakes: unused imports/names, undefined
# names) are the baseline the existing codebase already passes cleanly.
# Broadening this (import sorting, pyupgrade, ...) is the
# "ongoing" half of TST-07's effort estimate -- each addition should land
# as its own change once the resulting diff has been reviewed, not folded
# in silently here. B (flake8-bugbear) is the first such addition: unlike
# E4/E7/E9/F it flags real logic risks rather than syntax errors, so its
# six pre-existing hits (bare `zip()` without `strict=`, a blind
# `pytest.raises(Exception)`, an `assert False`) were each read and fixed
# individually rather than autofixed/suppressed.
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.11"
# TST-07: "mypy/pyright incrementally (non-blocking -> blocking per
# module)". The existing code predates type-checking in CI and mypy's
# default strictness currently finds ~87 pre-existing errors across ~20
# files (mostly connector wiring in daemon_main.py and a few Starlette/ASGI
# signature mismatches) -- none of them are new to this change, and fixing
# them all is out of this PR's scope (see CLAUDE.md's own "don't silently
# expand scope" note). CI runs mypy over the whole tree non-blocking (informational only) so those
# pre-existing errors are visible without failing every build; per-module
# `[[tool.mypy.overrides]]` blocks should be added below as modules get cleaned up and
# promoted to blocking -- see url_safety.py's override just below for the first one, and its
# own comment for why that override spells out strict's component flags individually rather
# than using the `strict = true` shorthand.
#
# "Promoted to blocking" is literal, and is enforced by a *second* mypy step in
# .github/workflows/tests.yml's `static-analysis` job: `scripts/mypy_strict_modules.py` reads the
# module list straight out of the overrides below and runs mypy over just those files, without
# `continue-on-error`. Adding a block below is therefore all it takes to put a module behind a
# merge gate -- nothing in the workflow repeats the list. (Until that step existed, the only mypy
# invocation in CI was the informational one, so an override changed which errors mypy printed and
# gated nothing at all.)
ignore_missing_imports = true

# First per-module promotion named in the comment above: url_safety.py is small,
# security-critical (the href-scheme allowlist stopping a Markdown link from becoming a
# `javascript:` URI), and was already clean under mypy's default settings -- strict mode found
# nothing further to fix. Spelled out as individual flags rather than `strict = true`: on
# mypy 2.3.1, a per-module `strict = true` override does not stay scoped to that module --
# some of the flags it bundles (e.g. `warn_unused_configs`) only ever have a global effect in
# this mypy version, so setting them via a module override silently turns them on for every
# module and reintroduced hundreds of unrelated errors elsewhere when tried here. Listing only
# the flags that *are* genuinely per-module avoids that; re-check this against the installed
# mypy version before ever reaching for the `strict = true` shorthand in a future override.
# Add the next module here once it's been cleaned up the same way, rather than waiting to
# chase the whole-tree error count to zero.
[[tool.mypy.overrides]]
module = "privacyfence.url_safety"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

# Next four promotions (privacyfence/privacyfence#377): each was already clean under the
# flags above with no code changes needed, matching url_safety.py's own bar -- small,
# security-critical, and picked from the issue's own candidate list (org-config trust,
# 100%-covered fail-closed/session-boundary modules). privacyfence.privacy_filter, also on
# that list, is deliberately *not* here yet: it has one real `no-any-return` finding
# (category_policy() returning an internal `dict[str, Any]` lookup) that needs an actual
# typed-shape fix, not just a flag flip, so it's left for a PR that touches that file.
[[tool.mypy.overrides]]
module = "privacyfence.org_bundle_signing"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = "privacyfence.safe_errors"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = "privacyfence.web.session_auth"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = "privacyfence.web.org_session"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.bandit]
# TST-07: "bandit or semgrep for security-focused rules". Scans src/ only
# for now (tests/ trips B101 `assert_used` constantly, which is how pytest
# assertions work, not a finding). The two real B314 findings this used to flag (SEC-14, Phase 3
# item 3.2 -- xml.etree.ElementTree on attachment content) were fixed by switching
# text_extraction.py's DOCX/PPTX parsing to defusedxml. What was left was a handful of
# low-severity false positives -- constant/filename strings read as B105 "hardcoded password
# strings" (`web_token`, `mcp_token`, `TOKEN_URL`, ...), the OAuth `token_type="Bearer"` literal
# read as B106, `assert`s used for internal invariant-narrowing rather than input validation
# (B101), and defensive `except Exception: pass`/`continue` around per-line audit-log parsing
# (B110/B112) -- each now triaged and annotated `# nosec BXXX  # <reason>` at its call site
# rather than suppressed here, so a *new* instance of any of these still gets flagged. With that
# triage done, this runs blocking in CI alongside ruff (see [tool.ruff.lint] above); a real
# finding fails the `static-analysis` job the same way a ruff violation does.
exclude_dirs = ["tests"]
