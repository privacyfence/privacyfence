# Admin policy for tld ops repo-admin (the admin guide in the tkcs-lab/tkcs-lab-devflow repository).
# Run it where an organisation owner's token is available, never from a web session:
#   tld ops repo-admin validate-policy .tld/admin-policy.yaml
#   tld ops repo-admin audit --policy .tld/admin-policy.yaml
# Everything irreversible is off; apply is a dry run until --yes, and deletes need --allow-delete.

org: privacyfence

repos:
  include: ["privacyfence"]        # this repository only; widen when the policy fits the other repositories
  skip_archived: true
  skip_forks: true

repo_settings:
  allow_auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true

security:
  vulnerability_alerts: true
  automated_security_fixes: true
  secret_scanning: true
  secret_push_protection: true
  private_vulnerability_reporting: true

actions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false

rulesets:
  default_branch:                  # ruleset tld-main
    required_status_checks:       # exact GitHub check names; every job runs on every PR (tests.yml has no path filters)
      - test
      - static-analysis
      - "Test (Python 3.11, core suite)"
      - "Test (Python 3.12, core suite)"
      - "Test (Python 3.14, core suite)"
    admin_bypass: true             # single human owner: they merge their own PRs through a pull request; skips the required checks for that merge
  tags: true                       # ruleset tld-tags: only the owner creates tags; releases go through tld-release

agent:
  agent_login: andras-tkcs-agent
  branch_policy: default_branch

release:
  reviewer_login: andras-tkcs
  environment: tld-release

config_dirs:
  forbid: [".archon", ".agents"]
  known: [.claude-plugin]   # the plugin marketplace manifest

workflow_lint:
  pin_actions: third_party
  require_permissions: true
  forbid_pull_request_target: true

workflows:
  - template: release
    params: { tag_prefix: "v", version_style: pep440, create_release: "false" }
  - template: land
