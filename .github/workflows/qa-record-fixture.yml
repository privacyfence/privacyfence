name: Record QA fixture

# On-demand counterpart to connector-live-check.yml: re-records *one*
# connector's live fixture and commits it to the branch named in the `branch`
# input.
#
# Dispatched on `main`, never on the feature branch: the runner group that holds the
# QA credentials admits only main's copies of this workflow and connector-live-check.yml,
# so a branch can't edit the workflow it would then run on the runner. The feature branch's
# code is checked out only after the `branch` input has passed the refusals below. The
# `record` job holds the runner and the credentials with a read-only token; the
# `commit-fixture` job, on a GitHub-hosted runner, is the only one that can push.
#
# Why this exists separately from connector-live-check.yml, which can also
# run --record: that workflow only records as *drift remediation* (its
# record step is `if: steps.check.outcome == 'failure'`), so a connector
# whose --check passes but which has no committed fixture yet -- exactly
# the state a newly-added check_<connector>() is in -- is never recorded by
# it. It also records every connector at once and opens its PR against a
# fixed drift branch, neither of which fits "record the one new connector
# onto the branch that adds it".
#
# workflow_dispatch only. Never `pull_request`, never `push` -- the rule
# connector-live-check.yml states, for the reason it gives: this is the
# only runner where the QA connectors' live OAuth tokens exist -- runner.privacyfence.eu, label
# `privacyfence-live`, runner group `privacyfence-live` (see
# docs/connector-qa.md's "Runner requirements" section,
# docs/testing-policy.md's "Layer 5: live connector", and ADR 0019
# (docs/adr/0019-live-connector-credentials-only-on-a-self-hosted-runner.md)
# for why), and a fork's PR ref is exactly the kind of ref
# a non-maintainer controls. Dispatching requires write access by
# definition.
#
# GitHub only offers workflow_dispatch for workflows already on the default
# branch, so this is dispatchable once it has merged to main.
on:
  workflow_dispatch:
    inputs:
      connector:
        description: 'Connector to record (one of CONNECTOR_CHECKS in scripts/qa_fixture_recorder.py)'
        required: true
        default: apps_script
        type: string
      branch:
        description: 'Branch to record the fixture for (the feature branch that adds the connector)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Deliberately the *same* group as connector-live-check.yml, not a group
  # of its own: both jobs copy the QA principal's tokens from the QA server's
  # data directory into their own checkout and write refreshed ones back at
  # the end. Two of them overlapping would race on those tokens and could
  # write back a stale token over a freshly refreshed one.
  group: connector-live-check
  cancel-in-progress: false

env:
  # The runner's hand-placed configuration (tests/fixtures/qa_environment.yaml, and an optional
  # org/org_bundle.json); the tokens of the `qa-live` principal come from the QA server's data
  # directory instead -- see connector-live-check.yml.
  QA_SECRETS_DIR: ~/privacyfence
  PRIVACYFENCE_PEEK_BASE_URL: https://peek-qa.privacyfence.eu
  PRIVACYFENCE_GRIST_SERVER_URL: https://docs.getgrist.com
  PF_QA_PRINCIPAL_ID: ${{ vars.PF_QA_PRINCIPAL_ID }}

jobs:
  record:
    runs-on: [self-hosted, privacyfence-live]
    timeout-minutes: 20
    permissions:
      contents: read   # this job holds live credentials and never gets a write token

    env:
      # Read through the shell's environment rather than interpolated into
      # the script below, so a dispatch input can't inject shell.
      #
      # The `||` default is belt-and-braces rather than dead: workflow_
      # dispatch does supply this input, but any path that leaves it empty
      # turns the run below into `--record ""`, which the recorder reports
      # as "has no recorder implementation yet" on stderr and then *exits
      # 0* (it has no failed results to report) -- a green job that
      # recorded nothing. Worth a default and the guard step below rather
      # than trusting that no such path ever appears.
      CONNECTOR: ${{ inputs.connector || 'apps_script' }}
      BRANCH: ${{ inputs.branch }}

    steps:
      - name: Refuse anything but a dispatch on main for an existing feature branch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "##[error] Dispatch this workflow on main and name the branch in the 'branch' input."
            exit 1
          fi
          # releases/* is protected the same as main (see CONTRIBUTING.md), and so is stable --
          # this workflow commits straight to the branch, which a ruleset-protected branch must
          # never accept outside a PR merge. refs/ and pull/ would reach a pull-request ref, and
          # with it a fork's code, on the runner that holds the QA credentials.
          if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "main" ] || [ "${BRANCH}" = "stable" ] \
             || [[ "${BRANCH}" == releases/* ]] || [[ "${BRANCH}" == refs/* ]] \
             || [[ "${BRANCH}" == pull/* ]] || [[ "${BRANCH}" == -* ]] \
             || ! git check-ref-format --branch "${BRANCH}" >/dev/null 2>&1; then
            echo "##[error] The 'branch' input must name a feature branch -- never main, stable," \
                 "a releases/* branch, or a refs/ or pull/ ref."
            exit 1
          fi
          # No checkout has happened yet, so ask the repository by URL. Only a real branch head
          # passes: no pull-request ref, fork code included, can reach this runner.
          if ! git ls-remote --exit-code --heads \
               "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "refs/heads/${BRANCH}" >/dev/null; then
            echo "##[error] Branch '${BRANCH}' does not exist in ${GITHUB_REPOSITORY}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ inputs.branch }}
          # fetch-depth: 0 for the same reason tests.yml/build.yml pass it:
          # setuptools_scm resolves the version from tag history, and a
          # shallow clone silently falls back to fallback_version (see
          # docs/releasing.md).
          fetch-depth: 0

      # Rebuilt every run rather than kept as runner-local state, same
      # reasoning as connector-live-check.yml's own venv step.
      - name: Build this run's venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements/dev.lock.txt
          .venv/bin/pip install --no-deps --no-build-isolation -e .

      # Same step as connector-live-check.yml's, for the same reasons: the secrets reach only this
      # step's environment, and the last step of this job deletes the module they produce.
      - name: Write built-in app credentials
        env:
          PF_APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.PF_APP_GOOGLE_WEB_CLIENT_ID }}
          PF_APP_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.PF_APP_GOOGLE_WEB_CLIENT_SECRET }}
          PF_APP_SLACK_CLIENT_ID: ${{ secrets.PF_APP_SLACK_CLIENT_ID }}
          PF_APP_SLACK_CLIENT_SECRET: ${{ secrets.PF_APP_SLACK_CLIENT_SECRET }}
          PF_APP_SALESFORCE_CLIENT_ID: ${{ secrets.PF_APP_SALESFORCE_CLIENT_ID }}
          PF_APP_SALESFORCE_CLIENT_SECRET: ${{ secrets.PF_APP_SALESFORCE_CLIENT_SECRET }}
          PF_APP_ATLASSIAN_RELAY_CLIENT_ID: ${{ secrets.PF_APP_ATLASSIAN_RELAY_CLIENT_ID }}
          PF_APP_ATLASSIAN_RELAY_CLIENT_SECRET: ${{ secrets.PF_APP_ATLASSIAN_RELAY_CLIENT_SECRET }}
          PF_APP_MIRO_CLIENT_ID: ${{ secrets.PF_APP_MIRO_CLIENT_ID }}
          PF_APP_MIRO_CLIENT_SECRET: ${{ secrets.PF_APP_MIRO_CLIENT_SECRET }}
        run: python3 scripts/builtin_apps.py write

      # Mirrors connector-live-check.yml's copy-in step exactly -- see that
      # workflow's comment for where the tokens and the configuration come from.
      - name: Copy this runner's QA tokens and configuration into the checkout
        run: |
          set -euo pipefail
          secrets_dir="$(eval echo "${QA_SECRETS_DIR}")"
          if [ ! -e "${secrets_dir}/tests/fixtures/qa_environment.yaml" ]; then
            echo "##[error] ${secrets_dir}/tests/fixtures/qa_environment.yaml not found." \
                 "See docs/connector-qa.md's 'Persistent QA state' section."
            exit 1
          fi
          .venv/bin/python scripts/qa_runner_tokens.py pull --data-dir "$HOME/qa-org-data"
          mkdir -p tests/fixtures
          cp -a "${secrets_dir}/tests/fixtures/qa_environment.yaml" tests/fixtures/qa_environment.yaml
          if [ -f "${secrets_dir}/org/org_bundle.json" ]; then
            mkdir -p org
            cp -a "${secrets_dir}/org/org_bundle.json" org/org_bundle.json
          fi

      # Guards the same silent-success hole the CONNECTOR default above
      # does, for the other way in: a mistyped dispatch input. The recorder
      # treats an unknown connector as "nothing to do" and still exits 0,
      # so an unrecognised name has to fail here instead.
      - name: Check the connector has a recorder implementation
        run: |
          set -euo pipefail
          # Validated before the grep, and the grep is fixed-string: the value also flows into the
          # artifact `path:` below on the runner that holds the QA credentials.
          if ! printf '%s' "${CONNECTOR}" | grep -Eq '^[a-z_]+$'; then
            echo "##[error] '${CONNECTOR}' is not a valid connector name (^[a-z_]+$)."
            exit 1
          fi
          if ! grep -Fq "    \"${CONNECTOR}\": check_" scripts/qa_fixture_recorder.py; then
            echo "##[error] '${CONNECTOR}' is not registered in CONNECTOR_CHECKS" \
                 "in scripts/qa_fixture_recorder.py."
            exit 1
          fi

      # No continue-on-error, unlike connector-live-check.yml's --check
      # step: there, a non-zero exit means drift to remediate; here it
      # means the recorder refused to record (seed artifact missing, or its
      # title/summary doesn't carry [QATEST]), and committing nothing while
      # reporting success would be the one outcome worth avoiding.
      # qa_fixture_recorder.py writes a fixture only for a result it marked
      # ok, so a refused recording can never reach the commit step below.
      - name: Record the fixture
        run: |
          .venv/bin/python scripts/qa_fixture_recorder.py \
            --record "${CONNECTOR}" \
            --report-file /tmp/qa-record-report.md

      # Hands only the recorded fixture to the `commit-fixture` job. The checkout also holds
      # this runner's copied-in tokens and qa_environment.yaml at this point -- all of it
      # is git-ignored, but uploading just this directory keeps them out of the artifact.
      - name: Upload the recorded fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorded-fixture
          path: tests/fixtures/live/${{ env.CONNECTOR }}
          if-no-files-found: error
          retention-days: 7

      # Mirrors connector-live-check.yml's copy-back step, and matters for
      # the same reason: a *_client.py that refreshed an expired access
      # token during this run persisted it into this disposable checkout,
      # and losing it here would leave the QA server's data directory holding
      # a token this run may already have spent.
      - name: Copy any refreshed QA tokens back to the QA server's data directory
        if: always()
        run: .venv/bin/python scripts/qa_runner_tokens.py push --data-dir "$HOME/qa-org-data"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-record-report-${{ inputs.connector || 'apps_script' }}
          path: /tmp/qa-record-report.md
          retention-days: 90

      # Last on purpose, and always: the runner is not ephemeral.
      - name: Delete built-in app credentials
        if: always()
        run: rm -f src/privacyfence/_builtin_apps.py

  # The only job here that can push. Runs on a GitHub-hosted runner, so the write token never
  # reaches the machine that holds the QA credentials.
  commit-fixture:
    needs: record
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the recorded fixture back to the branch
    env:
      CONNECTOR: ${{ inputs.connector || 'apps_script' }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ inputs.branch }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recorded-fixture
          path: tests/fixtures/live/${{ env.CONNECTOR }}

      # Only ever stage the recorded fixture itself.
      - name: Commit and push the recorded fixture
        run: |
          set -euo pipefail
          git add -- 'tests/fixtures/live/**'
          if git diff --cached --quiet; then
            echo "No fixture change for ${CONNECTOR} -- nothing to commit."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit \
                -m "Record live ${CONNECTOR} fixture" \
                -m "Recorded on the privacyfence-live runner by .github/workflows/qa-record-fixture.yml against the QA account's [QATEST]-tagged seed artifact. Identity fields and structural resource ids/URLs are de-identified by scripts/qa_fixture_recorder.py before writing; review this diff before merging, per docs/testing-policy.md 2.1."
          git push origin "HEAD:refs/heads/${BRANCH}"
