name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/images/**"
      - "src/privacyfence/resources/icon_512.png"
      - ".github/workflows/pages.yml"
  release:
    types: [published, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A `release` run's own ref is the tag (e.g. refs/tags/v4.0.0), not refs/heads/main -- and the
  # github-pages environment's deployment branch/tag protection rule only allows main, so a `build`/
  # `deploy` job running directly off a release event fails immediately, before any step, every time
  # (verified: every release-triggered run of this workflow has failed this way; every main-ref run
  # has succeeded). Nothing here needs the tag's content -- release_stats.py queries the GitHub API,
  # not the checkout -- so instead of running on the tag ref, just re-dispatch this same workflow
  # against main and let that already-working path do the actual build/deploy.
  redispatch-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build static site
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets _site/download
          # Named explicitly rather than `cp -r website/ _site/` so nothing lands on the public
          # site by accident. The cost of that is that a new website file is invisible until it is
          # added here -- which is exactly how the download page shipped as a 404 once the homepage
          # CTAs already pointed at it. tests/unit/test_website_download_cta.py now asserts every
          # file under website/ appears in this step, so that cannot happen silently again.
          cp website/index.html website/styles.css website/stats.js _site/
          cp website/download/index.html website/download/download.js _site/download/
          cp src/privacyfence/resources/icon_512.png _site/assets/icon.png
          cp docs/images/screenshots/gmail-read-thread.png _site/assets/
          cp docs/images/screenshots/sheets-write.png _site/assets/
          touch _site/.nojekyll

          python3 scripts/release_stats.py --repo "$REPOSITORY" --output _site/release-stats.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'release'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
