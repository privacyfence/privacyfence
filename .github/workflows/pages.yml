name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/images/**"
      - "scripts/build_site.py"
      - "scripts/r2_release.py"
      - "requirements/docs.lock.txt"
      - "src/privacyfence/resources/icon_512.png"
      - ".github/workflows/pages.yml"
  release:
    types: [published, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A `release` run's own ref is the tag (e.g. refs/tags/v4.0.0), not refs/heads/main -- and the
  # github-pages environment's deployment branch/tag protection rule only allows main, so a `build`/
  # `deploy` job running directly off a release event fails immediately, before any step, every time
  # (verified: every release-triggered run of this workflow has failed this way; every main-ref run
  # has succeeded). Nothing here needs the tag's content -- release_stats.py queries the GitHub API,
  # not the checkout -- so instead of running on the tag ref, just re-dispatch this same workflow
  # against main and let that already-working path do the actual build/deploy.
  redispatch-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag: /docs/ is published from the newest stable tag, not from main (see
          # docs/adr/0052-docs-are-built-with-zensical-from-the-latest-stable-tag.md), so the
          # build has to see them all to find it.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # The docs generator only, hash-locked; the build never installs the package itself.
      - name: Install the docs generator
        run: pip install --require-hashes -r requirements/docs.lock.txt

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # scripts/build_site.py is the whole site: the hand-written pages from their partials, the
      # files its manifest names (nothing else under website/ is published -- guardrail 7,
      # tests/unit/test_website_download_cta.py), /download/ pre-rendered from the download
      # Worker, /docs/ at the newest stable tag (skipped while that tag predates the published doc
      # set), and the generated sitemap.xml, robots.txt, llms.txt and llms-full.txt. It fails on a
      # broken internal link. The release -> redispatch-to-main path above reruns it after every
      # release, which is what moves /docs/ to a new stable version.
      - name: Build site
        run: python3 scripts/build_site.py --out _site --report site-report.json

      - name: Add release stats
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release_stats.py --repo "$REPOSITORY" --output _site/release-stats.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'release'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
