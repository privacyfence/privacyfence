name: Publish to PyPI

# Publishes only `privacyfence-sync` (ADR 0309), to TestPyPI and then PyPI. The `privacyfence`
# server is not published to a package index; its wheel is built only for the organization image
# in build.yml's `build-org-image`. The file keeps its name because the trusted-publisher entries
# on pypi.org and test.pypi.org are bound to it.
#
# Same trigger as build.yml (see docs/releasing.md) -- one tag push starts both. The
# `wait_for_build` job below blocks every publish step here on build.yml's own run for this exact
# commit succeeding, so a failed build.yml run blocks publication here too.
#
# Publishing itself uses PyPI's OIDC "Trusted Publisher" flow
# (pypa/gh-action-pypi-publish), not a stored API token: GitHub mints a
# short-lived OIDC token for the job (permissions: id-token: write below),
# and PyPI/TestPyPI trade it for a one-shot upload credential themselves.
# There is no long-lived secret anywhere for this workflow to leak. Before
# this workflow can publish for the first time, a maintainer has to
# register it as a Trusted Publisher on both test.pypi.org and pypi.org --
# see docs/releasing.md's "Publishing to PyPI".
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # rerun by hand, e.g. after a failed publish -- point it
                        # at a tagged commit, or the build carries a local
                        # version segment (+g<sha>) that both indexes reject

# Restrictive default for GITHUB_TOKEN, per CodeQL's actions/missing-workflow-
# permissions check -- only `build` actually inherits this (it checks out the
# repo); the two publish jobs below declare their own narrower job-level
# `permissions:` (id-token: write only, no contents access at all), which
# replaces this default for them rather than adding to it.
permissions:
  contents: read

jobs:
  # GitHub occasionally starts a workflow twice for one tag push, and two runs for one tag cannot
  # both succeed (ADR 0111). Every other job waits on this one; a duplicate cancels its own run.
  # If the API can't be read, the run goes ahead: the guard is an addition, not a gate.
  dedupe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # only to cancel this run when it is the duplicate
    outputs:
      duplicate: ${{ steps.check.outputs.duplicate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cancel this run if another run is already handling the same push
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if RUNS="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-pypi.yml/runs" \
              -f "head_sha=${GITHUB_SHA}" -F "per_page=30")"; then
            DUPLICATE="$(python3 scripts/release_run_guard.py --run-id "$GITHUB_RUN_ID" \
              --event "$GITHUB_EVENT_NAME" --ref-name "$GITHUB_REF_NAME" --head-sha "$GITHUB_SHA" <<<"$RUNS")"
          else
            echo "::warning::Could not list this workflow's runs; not checking for a duplicate run."
            DUPLICATE=false
          fi
          echo "duplicate=$DUPLICATE" >> "$GITHUB_OUTPUT"
          if [[ "$DUPLICATE" == "true" ]]; then
            echo "::warning::Another run of publish-pypi.yml is already handling ${GITHUB_REF_NAME} at ${GITHUB_SHA}; cancelling this duplicate run."
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # build.yml's packaged-artifact tests and org image run before anything from the same tag ships --
  # see docs/releasing.md's "Packaged-artifact release gating" section. This job wires that
  # guarantee into this workflow's own publish steps: a failed build.yml run blocks publication here.
  #
  # GitHub Actions has no native `needs:` across separate workflow files -- build.yml and this
  # workflow are two independent listeners on the same `push: tags: ['v*']` event. This job is the
  # closest equivalent: it polls the REST API for build.yml's *own* run against this exact commit
  # (not "the latest run of build.yml," which could be a different tag or a stray
  # workflow_dispatch) and blocks the publish jobs on that run actually succeeding, via an ordinary
  # `needs:` edge inside this workflow. `build` (the sync sdist/wheel) still runs immediately in
  # parallel -- it's cheap and side-effect-free -- only the publish jobs wait on this one.
  #
  # A `workflow_dispatch` rerun (e.g. after a transient publish failure) is gated the same way: if
  # build.yml's original run for that tag's commit already succeeded, this job finds that same
  # result immediately (the API query is keyed on commit SHA, not run recency) and the rerun
  # proceeds; if build.yml never succeeded for that commit, the rerun blocks here until someone
  # fixes and reruns "Build & Release" for that tag.
  # BUG (found while shipping v4.0.0a13-a15): this job used to poll via `actions/github-script`.
  # That action is referenced nowhere else in this repo's workflows -- every other action here
  # (checkout, setup-python, upload-artifact, download-artifact, gh-action-pypi-publish) is also
  # used by build.yml, which has kept running green the whole time. GitHub validates every `uses:`
  # in a workflow file before scheduling *any* of its jobs, so a repo-level actions allowlist that
  # was never updated for this one new action was enough to fail the entire run at startup --
  # zero jobs ever created, nothing in the Checks API, no logs -- on every tag since it was added.
  # Polling via the `gh` CLI instead needs no `uses:` action at all (it's preinstalled on
  # ubuntu-latest and already authenticates from GH_TOKEN), so it can't be blocked the same way.
  wait_for_build:
    needs: dedupe
    if: needs.dedupe.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read   # only permission this job needs -- it never checks out the repo
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for build.yml's run on this commit to succeed
        run: |
          set -euo pipefail
          workflow_id="build.yml"
          poll_interval_s=30
          # build.yml's `build-org-image` legs (image build plus smoke test) have run well past ten
          # minutes before; leave real headroom rather than risk a flaky timeout on release day.
          max_wait_s=$((60 * 60))
          start=$(date +%s)

          echo "Waiting for ${workflow_id}'s own run against commit ${GITHUB_SHA}..."

          while true; do
            # --method GET is required here: gh api defaults to POST as soon as any -f/-F
            # parameter is present (there's no POST route for listing workflow runs, so without
            # this it 404s -- see `gh api --help`), and this endpoint takes head_sha/per_page as
            # a GET query string, not a request body.
            runs_json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs" \
              -f "head_sha=${GITHUB_SHA}" -F "per_page=10")"
            # Most recent attempt for this exact commit, in case of a manual re-run.
            # A cancelled run is left out: a duplicate run cancels itself (ADR 0111), and one cancelled
            # by hand has nothing to say about this commit either way.
            run="$(jq -c '[.workflow_runs[] | select(.conclusion != "cancelled")] | sort_by(.id) | reverse | .[0] // empty' <<<"$runs_json")"

            if [[ -n "$run" ]]; then
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion' <<<"$run")"
              html_url="$(jq -r '.html_url' <<<"$run")"
              echo "Found ${html_url} (status=${status}, conclusion=${conclusion})"

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  echo "build.yml succeeded for this commit -- proceeding to publish."
                  exit 0
                fi
                echo "::error::build.yml's own run for this commit did not succeed" \
                  "(conclusion=${conclusion}): ${html_url}. Fix and re-run" \
                  "\"Build & Release\" for this tag, then re-run \"Publish to PyPI\"."
                exit 1
              fi
            fi

            now=$(date +%s)
            if (( now - start > max_wait_s )); then
              echo "::error::Timed out after $((max_wait_s / 60)) minutes waiting for" \
                "${workflow_id}'s run against ${GITHUB_SHA} to complete."
              exit 1
            fi
            sleep "$poll_interval_s"
          done

  build:
    needs: dedupe
    if: needs.dedupe.outputs.duplicate != 'true'
    runs-on: ubuntu-latest   # pure Python sdist/wheel of privacyfence-sync
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see docs/releasing.md)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # privacyfence-sync (sync/) is released with the same version, from the same tag (ADR 0309).
      # The release lock supplies `build`, and setuptools_scm for the version step below.
      - name: Build privacyfence-sync
        run: |
          pip install --require-hashes -r requirements/release.lock.txt
          python -m build --no-isolation --sdist --wheel sync --outdir sync-dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-dist-sync
          path: sync-dist/

      # Drives the public-index gating below (see docs/releasing.md and scripts/r2_release.py's
      # module docstring: only a "stable" tag reaches PyPI/TestPyPI). Same "skip off a tag"
      # tolerance as build.yml's identically-named step, for this workflow's own workflow_dispatch
      # reruns.
      - name: Determine version and release channel
        id: release
        run: |
          # This job doesn't install the package -- the release lock supplies setuptools_scm
          # here, as in build.yml's own version-detection steps.
          pip install --quiet --require-hashes -r requirements/release.lock.txt
          VERSION="$(python3 -m setuptools_scm)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/r2_release.py check-tag --tag "$GITHUB_REF_NAME" --version "$VERSION"
            CHANNEL="$(python3 scripts/r2_release.py channel "$VERSION")"
          else
            CHANNEL="n/a (not a tag push)"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION channel=$CHANNEL"

  # Always published first -- rehearses the real upload (same files, same
  # metadata) against TestPyPI before anything reaches the real index.
  #
  # Stable only -- alpha/beta/rc builds never reach a public index at all.
  publish-testpypi-sync:
    needs: [build, wait_for_build]
    if: needs.build.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment: testpypi   # must match the Environment name on TestPyPI's
                             # Trusted Publisher entry for privacyfence-sync
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist-sync
          path: dist/

      - name: Publish privacyfence-sync to TestPyPI
        # Pinned to the tip of upstream's own `release/v1` tracking branch
        # rather than a one-off tag -- that's the branch pypa itself
        # recommends following for v1.x, and Dependabot bumps this SHA the
        # same way it bumps any other action pin (see .github/dependabot.yml).
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.2 (release/v1)
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true   # lets a rerun after a partial failure succeed
                                 # without erroring on files TestPyPI already has

  # Gated behind the TestPyPI job above, and behind the "pypi" GitHub
  # Environment's own protection rules if any are configured (e.g. a
  # required reviewer) -- see docs/releasing.md for setting that up.
  publish-pypi-sync:
    needs: [build, publish-testpypi-sync]
    if: needs.build.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment: pypi   # must match the Environment name on PyPI's own
                         # Trusted Publisher entry for privacyfence-sync
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist-sync
          path: dist/

      - name: Publish privacyfence-sync to PyPI
        # See the TestPyPI job's step above for why this is pinned to release/v1's tip.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.2 (release/v1)
        with:
          skip-existing: true
