name: Deploy QA server

# docs/connector-qa.md, "The QA server". Builds the organization image from `main` and redeploys
# the QA server on the self-hosted runner's host, so the maintainer can connect the QA accounts in a
# browser at https://runner.privacyfence.eu. `/mcp` and every MCP OAuth endpoint are blocked at its
# proxy; the `verify` job checks that from the public internet.
#
# The runner runs one job at a time, so a deploy never overlaps a live check on the host. The deploy
# job checks out nothing and holds no secret: it hands the image to a root-owned script that takes
# no arguments (deploy/qa-runner/README.md).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "deploy/docker/**"
      - "deploy/qa-runner/**"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - "requirements/**"
      - ".github/workflows/deploy-qa-server.yml"
  workflow_dispatch:   # allow manual redeploys from the Actions tab

concurrency:
  group: qa-server-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    # A manual run from another branch must not deploy it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see docs/releasing.md)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned runtime dependencies
        run: pip install --require-hashes -r requirements/runtime.lock.txt

      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r requirements/dev.lock.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Determine version
        id: release
        run: echo "version=$(python -c 'from privacyfence import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Write Telegram app credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 scripts/telegram_credentials.py write

      - name: Write built-in app credentials
        env:
          PF_APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.PF_APP_GOOGLE_WEB_CLIENT_ID }}
          PF_APP_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.PF_APP_GOOGLE_WEB_CLIENT_SECRET }}
          PF_APP_SLACK_CLIENT_ID: ${{ secrets.PF_APP_SLACK_CLIENT_ID }}
          PF_APP_SLACK_CLIENT_SECRET: ${{ secrets.PF_APP_SLACK_CLIENT_SECRET }}
          PF_APP_SALESFORCE_CLIENT_ID: ${{ secrets.PF_APP_SALESFORCE_CLIENT_ID }}
          PF_APP_SALESFORCE_CLIENT_SECRET: ${{ secrets.PF_APP_SALESFORCE_CLIENT_SECRET }}
          PF_APP_ATLASSIAN_RELAY_CLIENT_ID: ${{ secrets.PF_APP_ATLASSIAN_RELAY_CLIENT_ID }}
          PF_APP_ATLASSIAN_RELAY_CLIENT_SECRET: ${{ secrets.PF_APP_ATLASSIAN_RELAY_CLIENT_SECRET }}
          PF_APP_MIRO_CLIENT_ID: ${{ secrets.PF_APP_MIRO_CLIENT_ID }}
          PF_APP_MIRO_CLIENT_SECRET: ${{ secrets.PF_APP_MIRO_CLIENT_SECRET }}
          PF_APP_GOOGLE_SIGNIN_CLIENT_ID: ${{ secrets.PF_APP_GOOGLE_SIGNIN_CLIENT_ID }}
          PF_APP_GOOGLE_SIGNIN_CLIENT_SECRET: ${{ secrets.PF_APP_GOOGLE_SIGNIN_CLIENT_SECRET }}
          PF_APP_SALESFORCE_INSTALL_URL: ${{ vars.PF_APP_SALESFORCE_INSTALL_URL }}
        run: python3 scripts/builtin_apps.py write

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Build org image
        run: |
          bash scripts/build_org_image.sh --platform linux/amd64 \
            --tag privacyfence-org:qa-main \
            --version "${{ steps.release.outputs.version }}"

      - name: Save org image
        run: |
          mkdir -p qa-image
          docker save privacyfence-org:qa-main | gzip > qa-image/privacyfence-org-qa.tar.gz

      - name: Upload org image as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-server-image
          path: qa-image/
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, privacyfence-live]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qa-server-image
          path: ~/qa-deploy/   # the runner's $HOME; the action expands the ~

      - name: Redeploy the QA server
        run: sudo -n /usr/local/sbin/pf-qa-deploy

  verify:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: The sign-in page answers
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' https://runner.privacyfence.eu/login)"
          echo "/login -> $code"
          case "$code" in 200|301|302|303|307|308) ;; *) echo "::error::/login answered $code"; exit 1 ;; esac

      - name: The MCP endpoints are closed
        run: |
          fail=0
          check() {
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X "$1" "https://runner.privacyfence.eu$2")"
            echo "$1 $2 -> $code"
            # 403 is the Cloudflare WAF rule (deploy/qa-runner/README.md, step 6), which answers
            # before the request reaches the proxy; 404 is the Caddyfile. Anything else is open.
            case "$code" in 403|404) ;; *) echo "::error::$1 $2 answered $code, not 403 or 404"; fail=1 ;; esac
          }
          check GET /mcp
          check GET /.well-known/oauth-authorization-server
          check GET /.well-known/oauth-protected-resource/mcp
          check GET /authorize
          check GET /register
          check POST /token
          exit "$fail"
