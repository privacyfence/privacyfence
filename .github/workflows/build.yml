name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  # GitHub occasionally starts a workflow twice for one tag push, and two runs for one tag cannot
  # both succeed (ADR 0111). Every other job waits on this one; a duplicate cancels its own run.
  # If the API can't be read, the run goes ahead: the guard is an addition, not a gate.
  dedupe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # only to cancel this run when it is the duplicate
    outputs:
      duplicate: ${{ steps.check.outputs.duplicate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cancel this run if another run is already handling the same push
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if RUNS="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs" \
              -f "head_sha=${GITHUB_SHA}" -F "per_page=30")"; then
            DUPLICATE="$(python3 scripts/release_run_guard.py --run-id "$GITHUB_RUN_ID" \
              --event "$GITHUB_EVENT_NAME" --ref-name "$GITHUB_REF_NAME" --head-sha "$GITHUB_SHA" <<<"$RUNS")"
          else
            echo "::warning::Could not list this workflow's runs; not checking for a duplicate run."
            DUPLICATE=false
          fi
          echo "duplicate=$DUPLICATE" >> "$GITHUB_OUTPUT"
          if [[ "$DUPLICATE" == "true" ]]; then
            echo "::warning::Another run of build.yml is already handling ${GITHUB_REF_NAME} at ${GITHUB_SHA}; cancelling this duplicate run."
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # Organization-mode Docker image (docs/org-mode-docker.md, ADRs 0209 and 0211). A matrix of two
  # legs on native runners -- `ubuntu-24.04` for linux/amd64, `ubuntu-24.04-arm` for linux/arm64 --
  # rather than QEMU emulation: each leg builds and tests the image on the architecture it ships
  # for, and the wheel plus the hash-pinned runtime lock install on both without per-arch packaging
  # work. Independent of the `sbom` job, so it runs in parallel with it.
  #
  # The image is tested here and saved as a workflow artifact, never pushed: a registry outage
  # inside this workflow would hold PyPI back (publish-pypi.yml waits for the whole run), so the
  # push, the tag combination and the attestation live in publish-org-image.yml, which downloads
  # exactly the bytes tested below. `finalize-release` does need this job, though, so a tag whose
  # image fails its test gets no GitHub Release either. The artifact names (`org-image-<arch>`)
  # deliberately do not match `finalize-release`'s `PrivacyFence-*` download pattern: the image is
  # not a GitHub Release asset (ADR 0301).
  build-org-image:
    needs: dedupe
    if: needs.dedupe.outputs.duplicate != 'true'
    name: build-org-image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see docs/releasing.md)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned runtime dependencies
        # The wheel is built against, and the image test runs with, the hash-verified lockfile
        # rather than a fresh resolve.
        run: pip install --require-hashes -r requirements/runtime.lock.txt

      - name: Install Python dependencies
        # [test] tooling comes with the dev lock: the image test and the org-mode Ubuntu release
        # smoke test need pytest, pytest-timeout and the org bundle signing helpers. The runtime
        # dependencies were installed by the step above.
        run: |
          pip install --require-hashes -r requirements/dev.lock.txt
          pip install --no-deps --no-build-isolation -e .

      # The release-workflow smoke test for the Ubuntu org-mode service --
      # strict startup, reverse-proxy/Host handling, route mounting,
      # per-principal session creation, MCP OAuth
      # discovery, clean shutdown/restart, against a synthetic org config
      # and a mocked IdP boundary (see that test module's own docstring).
      # It exercises the installable `privacyfence` package directly, so it runs right after the
      # dependencies are installed.
      - name: Run org-mode Ubuntu release smoke test
        env:
          PRIVACYFENCE_RUN_RELEASE_SMOKE_TESTS: "1"
          PRIVACYFENCE_REQUIRE_PACKAGED: "1"
        run: pytest tests/integration/test_org_ubuntu_release_smoke.py -v

      # The channel lookup is skipped (rather than failing the run) off a tag, so a manual run
      # from the Actions tab still builds.
      - name: Determine version and release channel
        id: release
        run: |
          VERSION="$(python -c 'from privacyfence import __version__; print(__version__)')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/r2_release.py check-tag --tag "$GITHUB_REF_NAME" --version "$VERSION"
            CHANNEL="$(python3 scripts/r2_release.py channel "$VERSION")"
          else
            CHANNEL="n/a (not a tag push)"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION channel=$CHANNEL"

      # The image carries the same Telegram app credentials as every other distribution (ADR 0040).
      - name: Write Telegram app credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 scripts/telegram_credentials.py write

      # The org image carries the built-in OAuth apps its servers sign in with (ADR 0255).
      # Secrets reach only this step.
      - name: Write built-in app credentials
        env:
          PF_APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.PF_APP_GOOGLE_WEB_CLIENT_ID }}
          PF_APP_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.PF_APP_GOOGLE_WEB_CLIENT_SECRET }}
          PF_APP_SLACK_CLIENT_ID: ${{ secrets.PF_APP_SLACK_CLIENT_ID }}
          PF_APP_SLACK_CLIENT_SECRET: ${{ secrets.PF_APP_SLACK_CLIENT_SECRET }}
          PF_APP_SALESFORCE_CLIENT_ID: ${{ secrets.PF_APP_SALESFORCE_CLIENT_ID }}
          PF_APP_SALESFORCE_CLIENT_SECRET: ${{ secrets.PF_APP_SALESFORCE_CLIENT_SECRET }}
          PF_APP_ATLASSIAN_RELAY_CLIENT_ID: ${{ secrets.PF_APP_ATLASSIAN_RELAY_CLIENT_ID }}
          PF_APP_ATLASSIAN_RELAY_CLIENT_SECRET: ${{ secrets.PF_APP_ATLASSIAN_RELAY_CLIENT_SECRET }}
          PF_APP_MIRO_CLIENT_ID: ${{ secrets.PF_APP_MIRO_CLIENT_ID }}
          PF_APP_MIRO_CLIENT_SECRET: ${{ secrets.PF_APP_MIRO_CLIENT_SECRET }}
          PF_APP_GOOGLE_SIGNIN_CLIENT_ID: ${{ secrets.PF_APP_GOOGLE_SIGNIN_CLIENT_ID }}
          PF_APP_GOOGLE_SIGNIN_CLIENT_SECRET: ${{ secrets.PF_APP_GOOGLE_SIGNIN_CLIENT_SECRET }}
          PF_APP_SALESFORCE_INSTALL_URL: ${{ vars.PF_APP_SALESFORCE_INSTALL_URL }}
        run: python3 scripts/builtin_apps.py write

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      # Same check as publish-pypi.yml's: a stable tag fails here, any other build only warns.
      - name: Check Telegram app credentials are packaged
        run: |
          REQUIRE=()
          if [[ "${{ steps.release.outputs.channel }}" == "stable" ]]; then REQUIRE=(--require); fi
          python3 scripts/telegram_credentials.py check-dist "${REQUIRE[@]}" dist/*.whl

      # Every release tag, pre-release included, must ship the apps: the alpha image is how 7.0 is
      # tested (ADR 0255). Only an untagged workflow_dispatch run warns.
      - name: Check built-in app credentials are packaged
        run: |
          REQUIRE=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then REQUIRE=(--require); fi
          python3 scripts/builtin_apps.py check-dist "${REQUIRE[@]}" dist/*.whl

      - name: Build org image
        run: |
          bash scripts/build_org_image.sh --platform linux/${{ matrix.arch }} \
            --tag privacyfence-org:ci-${{ matrix.arch }} \
            --version "${{ steps.release.outputs.version }}"

      - name: Run org image test
        env:
          PRIVACYFENCE_ORG_IMAGE: privacyfence-org:ci-${{ matrix.arch }}
          PRIVACYFENCE_REQUIRE_PACKAGED: "1"
        run: pytest tests/integration/test_org_docker_image.py -v

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-org-image-${{ matrix.arch }}-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Save org image
        run: |
          mkdir -p org-image
          docker save privacyfence-org:ci-${{ matrix.arch }} | gzip > org-image/privacyfence-org-${{ matrix.arch }}.tar.gz

      # No `if:` (so only an image whose test passed is uploaded) and not tag-gated, so a
      # pre-flight's image can be tried by hand. 30 days is also how long a rerun of
      # publish-org-image.yml can still find it.
      - name: Upload org image as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: org-image-${{ matrix.arch }}
          path: org-image/
          retention-days: 30

  # The CycloneDX SBOM of the Python runtime dependencies. Independent of `build-org-image`:
  # it needs only the tagged source tree, so it runs in parallel with it.
  sbom:
    needs: dedupe
    if: needs.dedupe.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see docs/releasing.md)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # This job doesn't install the package itself (see the "Generate Python SBOM" step's own
      # comment for why it deliberately doesn't), so it reads the tag-derived version straight
      # from setuptools_scm instead of from an installed __version__. The channel lookup is
      # skipped (rather than failing the run) off a tag.
      - name: Determine version and release channel
        id: release
        run: |
          pip install --quiet --require-hashes -r requirements/release.lock.txt
          VERSION="$(python3 -m setuptools_scm)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/r2_release.py check-tag --tag "$GITHUB_REF_NAME" --version "$VERSION"
            CHANNEL="$(python3 scripts/r2_release.py channel "$VERSION")"
          else
            CHANNEL="n/a (not a tag push)"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION channel=$CHANNEL"

      # From requirements/runtime.lock.txt, not a fresh resolve -- the SBOM
      # should describe exactly what a plain PyPI install of privacyfence gets
      # (and what pip-audit's blocking job in dependency-audit.yml already
      # vetted), not whatever the resolver would pick today.
      - name: Generate Python SBOM
        run: |
          pip install --require-hashes -r requirements/release.lock.txt
          cyclonedx-py requirements requirements/runtime.lock.txt \
            --pyproject pyproject.toml \
            --of JSON -o sbom-python.cdx.json

      - name: Upload SBOMs as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PrivacyFence-sbom
          path: |
            sbom-python.cdx.json
          retention-days: 30

      # The private R2 release archive (scripts/r2_release.py's module docstring): every channel's
      # SBOM lands in releases/<channel>/<version>/, alongside whatever else that release shipped.
      - name: Publish SBOMs to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CF_RELEASES_R2_ACCESS_KEY_ID: ${{ secrets.CF_RELEASES_R2_ACCESS_KEY_ID }}
          CF_RELEASES_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_RELEASES_R2_SECRET_ACCESS_KEY }}
          CF_RELEASES_R2_ENDPOINT: ${{ vars.CF_RELEASES_R2_ENDPOINT }}
          R2_BUCKET: privacyfence-releases
        run: |
          python3 -m pip install --quiet --require-hashes -r requirements/release.lock.txt
          python3 scripts/r2_release.py upload --version "${{ steps.release.outputs.version }}" \
            sbom-python.cdx.json

  # The published release (ADR 0301). `sbom` and `build-org-image` each upload their own workflow
  # artifact and R2 objects independently; this job turns them into a GitHub Release only once
  # both have succeeded, so the release either gets the complete file set or (this job failing,
  # or one of its `needs` failing) is not touched at all. `build-org-image` produces no GitHub
  # Release asset, but a tag whose org image failed its test has not fully shipped, so it gets no
  # release either; only the registry *push* is kept out of this workflow (publish-org-image.yml;
  # ADR 0209). This job also uploads the org admin tools (scripts/sync_room_directory.py,
  # scripts/sign_connector_config.py and the connector config signing page) to the R2 archive.
  finalize-release:
    needs: [sbom, build-org-image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Needs `contents: write` because it's the one place that calls action-gh-release, to attach
    # the complete artifact set (or, on a pre-release tag, to create the asset-less release entry).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags -- setuptools_scm needs them (see docs/releasing.md)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # Same lightweight resolution the `sbom` job uses: read the tag-derived version straight
      # from setuptools_scm rather than installing the package just to import
      # __version__, which this job has no other use for. Channel is needed here too: it decides
      # whether the GitHub Release below gets the full artifact set or stays asset-less.
      - name: Determine version and release channel
        id: release
        run: |
          pip install --quiet --require-hashes -r requirements/release.lock.txt
          VERSION="$(python3 -m setuptools_scm)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 scripts/r2_release.py check-tag --tag "$GITHUB_REF_NAME" --version "$VERSION"
          CHANNEL="$(python3 scripts/r2_release.py channel "$VERSION")"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Finalizing version=$VERSION channel=$CHANNEL"

      # Pulls the `sbom` job's workflow artifact (`PrivacyFence-sbom`) into one flat directory --
      # `merge-multiple: true` so files land directly under `release-assets/` rather than one
      # subdirectory per artifact name, matching the flat file list the "Attach release assets"
      # step below references.
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: PrivacyFence-*
          path: release-assets
          merge-multiple: true

      # The release body is CHANGELOG.md's section for this version, not GitHub's auto-generated
      # list of merged pull requests (for 4.0.0 that list would have been ~127 lines). The notes
      # are written and reviewed in an ordinary PR; tag day involves no writing.
      #
      # action-gh-release overwrites an existing release's body when `body_path` resolves to
      # non-empty content (`append_body` defaults to false), so this replaces whatever the GitHub
      # UI generated when the release was pre-created. It silently keeps the existing body if the
      # file can't be read, which is why rendering is its own step: a stable tag with no CHANGELOG
      # section fails the job here instead of quietly shipping the auto-generated wall.
      - name: Render release notes from CHANGELOG.md
        if: steps.release.outputs.channel == 'stable'
        run: |
          python3 scripts/changelog_section.py "${{ steps.release.outputs.version }}" > release-notes.md

      # The recipe-writing skill, zipped as a Claude plugin with the release version stamped in
      # (ADR 0163). Stable only, like the attach step below that uploads it.
      - name: Build the privacyfence-sync plugin zip (stable only)
        if: steps.release.outputs.channel == 'stable'
        run: |
          python3 scripts/build_sync_plugin.py --version "${{ steps.release.outputs.version }}" \
            --out release-assets/privacyfence-sync-plugin.zip

      # The browser page that signs connector configs, attached next to its command-line twin
      # (scripts/sign_connector_config.py). Stable only, like the attach step below. The page is
      # copied unchanged: its Content-Security-Policy hashes cover its inline script and style.
      - name: Stage the connector config signing page (stable only)
        if: steps.release.outputs.channel == 'stable'
        run: |
          cp website/tools/connector-config/index.html release-assets/privacyfence-connector-config-tool.html

      # Only a stable tag also gets a public GitHub Release with attached files -- alpha/beta/rc
      # stop at the private R2 upload (see scripts/r2_release.py's module docstring for why).
      # One call, the complete file set -- see this job's own top comment.
      - name: Attach release assets (stable only)
        if: steps.release.outputs.channel == 'stable'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            scripts/sync_room_directory.py
            scripts/sign_connector_config.py
            release-assets/privacyfence-connector-config-tool.html
            release-assets/sbom-python.cdx.json
            release-assets/privacyfence-sync-plugin.zip
          body_path: release-notes.md
          prerelease: false

      # The release entry itself (tag + notes, no files) still gets created for every channel,
      # marked prerelease, so update_checker.py's beta update channel -- which reads exactly that
      # flag off the releases list -- keeps working without any underlying binary being public.
      - name: Create GitHub Release notes (pre-release, no public assets)
        if: steps.release.outputs.channel != 'stable'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: true

      # The org admin tools go to the private R2 release archive for every channel, stable and
      # pre-release alike: scripts/sync_room_directory.py and scripts/sign_connector_config.py are
      # themselves a release output, run by org admins (not contributors) -- see their own
      # docstrings and docs/google-cloud-setup.md, docs/slack-setup.md, docs/salesforce-setup.md,
      # docs/atlassian-setup.md. The browser tool for signing connector configs is named as a
      # release asset: the archive keeps the file under its basename, and the offline copy is
      # pinned to this release.
      #
      # Requires these GitHub secrets/vars (Settings → Secrets and variables → Actions):
      #   CF_RELEASES_R2_ACCESS_KEY_ID / CF_RELEASES_R2_SECRET_ACCESS_KEY  — R2 API token (secrets)
      #   CF_RELEASES_R2_ENDPOINT                                         — R2 endpoint URL (var)
      - name: Publish org admin tools to Cloudflare R2
        env:
          CF_RELEASES_R2_ACCESS_KEY_ID: ${{ secrets.CF_RELEASES_R2_ACCESS_KEY_ID }}
          CF_RELEASES_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_RELEASES_R2_SECRET_ACCESS_KEY }}
          CF_RELEASES_R2_ENDPOINT: ${{ vars.CF_RELEASES_R2_ENDPOINT }}
          R2_BUCKET: privacyfence-releases
        run: |
          python3 -m pip install --quiet --require-hashes -r requirements/release.lock.txt
          mkdir -p dist
          cp website/tools/connector-config/index.html dist/privacyfence-connector-config-tool.html
          python3 scripts/r2_release.py upload --version "${{ steps.release.outputs.version }}" \
            scripts/sync_room_directory.py \
            scripts/sign_connector_config.py \
            dist/privacyfence-connector-config-tool.html

      # The `stable` branch is what the Claude Cowork / Claude Code plugin marketplace follows to
      # get the latest stable release instead of `main` (ADR 0169). Last on purpose: a failure
      # here must never hold back the release above. A plain
      # fast-forward push: a release that does not descend from the previous one fails loudly
      # instead of silently rewriting `stable`.
      - name: Point the `stable` branch at this release (stable only)
        if: steps.release.outputs.channel == 'stable'
        run: git push origin "${{ github.sha }}:refs/heads/stable"
