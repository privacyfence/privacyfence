name: Connector live check

# Runs only on a schedule or by explicit maintainer trigger -- never on
# pull_request, never on push from a branch a non-maintainer controls.
# Targets the self-hosted runner runner.privacyfence.eu, provisioned as docs/connector-qa.md's
# "Runner requirements" section describes (label `privacyfence-live`, runner group
# `privacyfence-live`), which is the only place these connectors' live OAuth tokens ever
# exist. The checks run in organization mode as the principal `qa-live`, with the built-in
# apps. See docs/testing-policy.md's
# "Layer 5: live connector" section and ADR 0019
# (docs/adr/0019-live-connector-credentials-only-on-a-self-hosted-runner.md) for why.
on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC -- matched to how often
                           # a provider API actually changes shape, not to
                           # PR cadence; see the plan's rationale
  workflow_dispatch:

permissions:
  contents: read   # the PR-opening job below widens this for itself; the runner job never holds write

concurrency:
  group: connector-live-check
  cancel-in-progress: false   # never cancel a run mid-way through a live
                               # provider call sequence

env:
  # The runner's hand-placed configuration (tests/fixtures/qa_environment.yaml, and an
  # optional org/org_bundle.json) -- outside any Actions-managed workspace, never a GitHub
  # Actions secret. The tokens are not kept here: they live in the QA organization server's
  # data directory ($HOME/qa-org-data), and scripts/qa_runner_tokens.py copies them in and back.
  QA_SECRETS_DIR: ~/privacyfence
  # Peek and Grist have no relay app; their addresses come from the environment
  # (docs/connector-qa.md, "The QA server").
  PRIVACYFENCE_PEEK_BASE_URL: https://peek-qa.privacyfence.eu
  PRIVACYFENCE_GRIST_SERVER_URL: https://docs.getgrist.com
  # Names the QA principal's folder under the QA server's users/ when more than one holds
  # tokens; empty when the repository variable is unset.
  PF_QA_PRINCIPAL_ID: ${{ vars.PF_QA_PRINCIPAL_ID }}
  # Telegram's api_id/api_hash are NOT a per-account credential like the
  # other four connectors' OAuth grants -- they're a single, shared app
  # identity, the same for every user and every phone number, already
  # baked into every distributed PrivacyFence release build (see
  # app_credentials.py, docs/telegram-setup.md). This repo already
  # stores them as the TELEGRAM_API_ID/TELEGRAM_API_HASH secrets
  # build.yml uses on GitHub-hosted runners for exactly that -- reusing
  # them here doesn't touch the "never provision a connector credential
  # to GitHub Actions" policy at all, since that policy is specifically
  # about the real per-account OAuth grants. The actual per-account
  # Telegram credential (the session file connected on the QA server)
  # still lives only in the QA server's data directory, like the other
  # tokens -- this only supplies the app-level id/hash pair.
  PRIVACYFENCE_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  PRIVACYFENCE_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

jobs:
  live-check:
    runs-on: [self-hosted, privacyfence-live]
    timeout-minutes: 20   # generous but bounded -- a few minutes of read
                           # calls plus one venv build, not an open-ended job
    permissions:
      contents: read      # this job holds live credentials and never gets a write token
    outputs:
      drift: ${{ steps.check.outcome == 'failure' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # clean: true (the default) is exactly what we want here: this
          # checkout is fully ephemeral, rebuilt from scratch every run,
          # and never holds anything worth preserving between runs --
          # the QA tokens and configuration live outside this workspace
          # entirely and get copied in below.

      # Built fresh every run rather than kept as a persistent runner-local
      # venv: costs an extra ~1-2 minutes on this weekly/on-demand job, but
      # means a pyproject.toml dependency change is picked up automatically
      # instead of silently drifting from whatever this runner last had
      # installed. No actions/setup-python -- plain `python3` (whatever
      # this runner already has on PATH) is used rather than pinning an
      # exact minor version: pyproject.toml only requires >=3.11, and
      # that floor is all this job needs -- unlike
      # scripts/update_dependency_locks.sh, this doesn't touch a lockfile,
      # so there's no reproducibility reason to match tests.yml's 3.13
      # exactly. The point of skipping setup-python here is keeping this
      # credential-holding job's own steps minimal and auditable.
      - name: Build this run's venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements/dev.lock.txt
          .venv/bin/pip install --no-deps --no-build-isolation -e .

      # Written from CI secrets into this one step's environment, never the job's or the
      # workflow's, and deleted by the last step of this job: the runner is not ephemeral.
      # The Google sign-in client is not used by the live checks, so it is not passed.
      - name: Write built-in app credentials
        env:
          PF_APP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.PF_APP_GOOGLE_WEB_CLIENT_ID }}
          PF_APP_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.PF_APP_GOOGLE_WEB_CLIENT_SECRET }}
          PF_APP_SLACK_CLIENT_ID: ${{ secrets.PF_APP_SLACK_CLIENT_ID }}
          PF_APP_SLACK_CLIENT_SECRET: ${{ secrets.PF_APP_SLACK_CLIENT_SECRET }}
          PF_APP_SALESFORCE_CLIENT_ID: ${{ secrets.PF_APP_SALESFORCE_CLIENT_ID }}
          PF_APP_SALESFORCE_CLIENT_SECRET: ${{ secrets.PF_APP_SALESFORCE_CLIENT_SECRET }}
          PF_APP_ATLASSIAN_RELAY_CLIENT_ID: ${{ secrets.PF_APP_ATLASSIAN_RELAY_CLIENT_ID }}
          PF_APP_ATLASSIAN_RELAY_CLIENT_SECRET: ${{ secrets.PF_APP_ATLASSIAN_RELAY_CLIENT_SECRET }}
          PF_APP_MIRO_CLIENT_ID: ${{ secrets.PF_APP_MIRO_CLIENT_ID }}
          PF_APP_MIRO_CLIENT_SECRET: ${{ secrets.PF_APP_MIRO_CLIENT_SECRET }}
        run: python3 scripts/builtin_apps.py write

      # The tokens come from the QA organization server's data directory, where the maintainer
      # connected the accounts in a browser (docs/connector-qa.md, "The QA server"). They land
      # in users/qa-live/credentials/ of this checkout, where the recorder's qa-live principal
      # reads them. qa_environment.yaml isn't a credential (non-secret seed-artifact ids), and
      # org/org_bundle.json is optional (an organization's own app to test); both are
      # runner-local files that have to survive an every-run-wiped checkout.
      - name: Copy this runner's QA tokens and configuration into the checkout
        run: |
          set -euo pipefail
          secrets_dir="$(eval echo "${QA_SECRETS_DIR}")"
          if [ ! -e "${secrets_dir}/tests/fixtures/qa_environment.yaml" ]; then
            echo "##[error] ${secrets_dir}/tests/fixtures/qa_environment.yaml not found." \
                 "See docs/connector-qa.md's 'Persistent QA state' section."
            exit 1
          fi
          .venv/bin/python scripts/qa_runner_tokens.py pull --data-dir "$HOME/qa-org-data"
          mkdir -p tests/fixtures
          cp -a "${secrets_dir}/tests/fixtures/qa_environment.yaml" tests/fixtures/qa_environment.yaml
          if [ -f "${secrets_dir}/org/org_bundle.json" ]; then
            mkdir -p org
            cp -a "${secrets_dir}/org/org_bundle.json" org/org_bundle.json
          fi

      - name: Run qa_fixture_recorder.py --check
        id: check
        run: |
          .venv/bin/python scripts/qa_fixture_recorder.py --check \
            --report-file /tmp/qa-check-report.md
        continue-on-error: true   # a drift finding is data, not a crash --
                                   # handled by the next step, not by failing
                                   # the job outright

      - name: Re-record on drift
        if: steps.check.outcome == 'failure'
        run: |
          .venv/bin/python scripts/qa_fixture_recorder.py --record \
            --report-file /tmp/qa-record-report.md

      # create/read/update/delete a fresh, uniquely-tagged QA object per
      # write-capable connector, on the same weekly schedule as --check
      # above. Unlike --check's drift, never continue-on-error -- a failed
      # write/read/update is a real provider-contract regression, and a
      # cleanup that didn't actually remove what it created would silently
      # accumulate objects in the QA accounts forever if this were swallowed
      # the same way drift is.
      - name: Run qa_fixture_recorder.py --lifecycle
        run: |
          .venv/bin/python scripts/qa_fixture_recorder.py --lifecycle \
            --report-file /tmp/qa-lifecycle-report.md

      # The runner job only hands the re-recorded fixtures over as artifacts;
      # the `open-drift-pr` job below, on a GitHub-hosted runner, is the only
      # one that holds a write token.
      - name: Upload drift fixtures
        if: steps.check.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-fixtures
          path: tests/fixtures/live
          retention-days: 7

      - name: Upload drift report
        if: steps.check.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-report
          path: /tmp/qa-record-report.md
          retention-days: 7

      # Weekly external check of the oauth relay (docs/oauth-relay.md). A failure is reported
      # in the summary and does not fail the job: the relay is not what this job tests.
      - name: Check the relay's health
        id: relay
        continue-on-error: true
        run: |
          if curl -fsSI --max-time 30 https://oauth.privacyfence.eu/health >/dev/null; then
            echo "relay: up" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "relay: down" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      # Mirrors the copy-in step above, reversed. Each *_client.py that
      # refreshes an expired OAuth access token already persists the
      # refreshed token back to disk in place (e.g. confluence_client.py's
      # _try_refresh() -> save_token_file(), which even already handles
      # Atlassian rotating the refresh token on use) -- but that write only
      # lands inside this run's disposable checkout. Atlassian's refresh
      # tokens are single-use, so a token that is not written back leaves the
      # next run refreshing with an already-spent one. `push` writes back
      # only the files this run changed, and skips one the maintainer
      # reconnected on the QA server meanwhile.
      # `if: always()`: a token can be refreshed (and rotated) by an early
      # step even when a later one fails -- losing that refreshed value
      # here would reproduce the same bug on the very next run.
      - name: Copy any refreshed QA tokens back to the QA server's data directory
        if: always()
        run: .venv/bin/python scripts/qa_runner_tokens.py push --data-dir "$HOME/qa-org-data"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-live-check-report
          path: /tmp/qa-*-report.md
          retention-days: 90

      # Last on purpose, and always: the runner is not ephemeral, so the generated module that
      # holds the built-in app credentials must not outlive the run.
      - name: Delete built-in app credentials
        if: always()
        run: rm -f src/privacyfence/_builtin_apps.py

  # Opens a PR only when --record actually changed a fixture file -- a
  # maintainer reviews the redacted diff exactly as the manual process in
  # testing-policy.md Sec 2.1 already describes, this just removes the
  # "someone has to remember to run it" step. Runs on a GitHub-hosted runner
  # so the write token never reaches the credential-holding runner.
  open-drift-pr:
    needs: live-check
    if: needs.live-check.outputs.drift == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to push the drift branch
      pull-requests: write   # needed for create-pull-request to open the PR itself
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drift-fixtures
          path: tests/fixtures/live

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drift-report
          path: /tmp

      - name: Open drift PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/connector-live-fixture-drift
          title: "chore: connector live fixture drift detected"
          commit-message: "Update recorded fixtures after provider API drift"
          body-path: /tmp/qa-record-report.md
          add-paths: tests/fixtures/live/**
