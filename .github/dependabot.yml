version: 2

# Six entries, matching the six places this repo declares a dependency version:
# pyproject.toml (the daemon),
# n8n/package.json (the n8n community node, docs/n8n-node.md),
# cloudflare/oauth-relay/package.json (the
# oauth.privacyfence.eu relay Worker, docs/oauth-relay.md), tests/integration/ai_clients/package.json
# (the exact-pinned AI-client CLIs the T3 contract tests run), and the SHA-pinned `uses:`
# lines in .github/workflows/*.yml themselves (see those files' own comments
# on why they're pinned to a commit instead of a tag), and the digest-pinned base image in
# deploy/docker/Dockerfile (the organization-mode Docker image). A PR from any of
# these six updates only the manifest/pin — it does not regenerate
# requirements/*.lock.txt, which is a derived file; the
# `lockfile-freshness` job in dependency-audit.yml catches a merged bump
# that leaves the lock file stale before it reaches main, and
# scripts/update_dependency_locks.sh is how a human (or a follow-up commit
# on the Dependabot PR) brings it back in sync.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      # Actions bump together in one PR -- they're independent third-party
      # projects, not a coupled dependency graph, so there's nothing a
      # per-action PR buys over reviewing one batch.
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    # pyproject.toml pins runtime deps with a floor (">=") and a handful of
    # explicit ceilings whose reasons are documented inline there (mcp,
    # webauthn, starlette, uvicorn) -- Dependabot respects an existing
    # upper bound and won't propose crossing it, so those comments stay the
    # real gate on a major bump either way.
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/n8n"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      n8n-node-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/cloudflare/oauth-relay"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      # package.json's `overrides.vitest` pin routes around a known npm/arborist resolution bug in this
      # dependency set -- batching keeps a Dependabot bump from reintroducing that mismatch across
      # two separate PRs.
      oauth-relay-worker-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/tests/integration/ai_clients"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    # Test-only: the AI-client CLIs tests.yml's T3 contract tests run
    # (tests/integration/ai_client_harness.py). A bump here is the pinned
    # half of what .github/workflows/ai-client-canary.yml already runs
    # against @latest every week; the `test` job is what proves it.
    groups:
      ai-client-clis:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    # Digest bumps only: moving off Python 3.12 is a deliberate change, like the .deb's runner (ADR 0203).
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
